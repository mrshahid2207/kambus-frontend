<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KAMBUS</title>
    <meta name="theme-color" content="#173541">
    <meta name="description" content="KAMBUS, live bus tracking for KITSW.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="kambus.css">
    <script src="kambus-ui.js"></script>
</head>
<body class="bg-bg text-navy font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-sm bg-surface border border-line rounded p-6 sm:p-8">
        <header class="flex flex-col items-center gap-3 mb-6">
            <img src="brand/kitsw-crest.png" alt="Kakatiya Institute of Technology and Science, Warangal" class="h-28 w-28">
            <div class="flex items-center gap-2">
                <img src="brand/mark-navy.svg" alt="" class="h-6 w-6" aria-hidden="true">
                <img src="brand/wordmark-navy.svg" alt="KAMBUS" class="h-5 w-auto">
            </div>
        </header>

        <div class="flex border border-line rounded p-1 mb-5 gap-1 bg-bg" role="tablist" aria-label="Role Selector">
            <button type="button" onclick="setRole('student')" id="tab-student" class="flex-1 py-1.5 text-xs font-semibold rounded bg-navy text-white transition-colors flex items-center justify-center" role="tab" aria-selected="true">
                Student
            </button>
            <button type="button" onclick="setRole('driver')" id="tab-driver" class="flex-1 py-1.5 text-xs font-semibold rounded text-ink-muted hover:text-navy transition-colors flex items-center justify-center" role="tab" aria-selected="false">
                Driver
            </button>
            <button type="button" onclick="setRole('admin')" id="tab-admin" class="flex-1 py-1.5 text-xs font-semibold rounded text-ink-muted hover:text-navy transition-colors flex items-center justify-center" role="tab" aria-selected="false">
                Admin
            </button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4" novalidate>
            <input type="hidden" id="selectedRole" value="student">

            <div>
                <label id="identityLabel" for="username" class="block text-xs font-semibold mb-1.5 text-navy">Roll Number</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-ink-muted flex items-center pointer-events-none">
                        <svg class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-id-card"/></svg>
                    </span>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter roll number" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"
                           class="w-full pl-9 pr-3 py-2 bg-surface border border-line rounded text-sm text-navy placeholder-ink-muted focus:border-brand focus:outline-none">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold mb-1.5 text-navy">Password</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-ink-muted flex items-center pointer-events-none">
                        <svg class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-lock"/></svg>
                    </span>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password" enterkeyhint="go"
                           class="w-full pl-9 pr-10 py-2 bg-surface border border-line rounded text-sm text-navy placeholder-ink-muted focus:border-brand focus:outline-none">
                    <button type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" aria-label="Show or hide password" aria-pressed="false" class="absolute right-2.5 text-ink-muted hover:text-navy p-1 focus:outline-none">
                        <svg id="passwordToggleIcon" class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-eye"/></svg>
                    </button>
                </div>
            </div>

            <label for="rememberMe" class="flex items-center gap-1.5 w-fit cursor-pointer select-none text-xs text-ink-muted pt-0.5">
                <input type="checkbox" id="rememberMe" class="w-3.5 h-3.5 rounded-sm border-line text-navy accent-navy">
                <span>Remember me</span>
            </label>

            <button type="submit" id="btnSubmit" class="w-full py-2.5 px-4 bg-navy text-white text-sm font-semibold rounded hover:bg-brand active:bg-brand transition-colors flex items-center justify-center gap-2 disabled:opacity-60">
                <span>Sign In</span>
                <svg class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-arrow-right"/></svg>
            </button>
        </form>
    </main>

    <script>
        const API_BASE = "https://kambus-backend.onrender.com";
        let currentRole = "student";

        document.addEventListener("DOMContentLoaded", () => {
            const isRemembered = localStorage.getItem("kambus_remember") === "true";
            const savedRole = localStorage.getItem("kambus_saved_role");
            const savedIdentifier = localStorage.getItem("kambus_saved_identifier");
            const rememberCheckbox = document.getElementById("rememberMe");

            if (isRemembered && rememberCheckbox) {
                rememberCheckbox.checked = true;
                if (savedRole) {
                    setRole(savedRole);
                }
                if (savedIdentifier) {
                    const usernameInput = document.getElementById("username");
                    if (usernameInput) usernameInput.value = savedIdentifier;
                }
            }
        });

        function setRole(role) {
            currentRole = role;
            document.getElementById("selectedRole").value = role;

            ["student", "driver", "admin"].forEach(r => {
                const tab = document.getElementById(`tab-${r}`);
                if (r === role) {
                    tab.className = "flex-1 py-1.5 text-xs font-semibold rounded bg-navy text-white transition-colors";
                    tab.setAttribute("aria-selected", "true");
                } else {
                    tab.className = "flex-1 py-1.5 text-xs font-semibold rounded text-ink-muted hover:text-navy transition-colors";
                    tab.setAttribute("aria-selected", "false");
                }
            });

            const label = document.getElementById("identityLabel");
            const usernameInput = document.getElementById("username");

            if (role === "student") {
                label.innerText = "Roll Number";
                usernameInput.placeholder = "Enter roll number";
            } else if (role === "driver") {
                label.innerText = "Driver Mobile / ID";
                usernameInput.placeholder = "Enter mobile or ID";
            } else {
                label.innerText = "Admin Username";
                usernameInput.placeholder = "Enter admin username";
            }
        }

        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            if (!passwordInput || !toggleIcon) return;

            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            toggleIcon.innerHTML = `<use href="icons.svg#icon-${isPassword ? 'eye-slash' : 'eye'}"/>`;
            const toggleButton = toggleIcon.closest("button");
            if (toggleButton) toggleButton.setAttribute("aria-pressed", String(isPassword));
        }

        async function handleLogin(e) {
            e.preventDefault();

            const identifier = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const rememberMe = document.getElementById("rememberMe")?.checked || false;
            const button = document.getElementById("btnSubmit");

            if (!identifier || !password) {
                notifyUser("warn", "Required Fields", "Please enter your identifier and password.");
                return;
            }

            const originalButtonContent = button.innerHTML;
            button.disabled = true;
            button.innerHTML = `
                <span>Signing In...</span>
                <svg class="w-4 h-4 animate-spin" aria-hidden="true"><use href="icons.svg#icon-spinner"/></svg>
            `;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password,
                        role: currentRole
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    let errorTitle = "Invalid Credentials";
                    let errorMsg = data.detail || "Please check your login details and try again.";

                    if (response.status === 403) {
                        errorTitle = "Verification Required";
                        if (currentRole === "student") {
                            errorMsg = "Your email is not verified yet. Please contact your transport administrator.";
                        }
                    } else if (response.status >= 500) {
                        errorTitle = "Server Unavailable";
                        errorMsg = "Please try again in a few moments.";
                    }

                    throw new Error(errorMsg);
                }

                if (!data.access_token) {
                    throw new Error("Authentication response was incomplete.");
                }

                localStorage.setItem("kambus_token", data.access_token);
                localStorage.setItem("kambus_role", data.role);
                localStorage.setItem("kambus_user_id", data.user_id);

                if (rememberMe) {
                    localStorage.setItem("kambus_remember", "true");
                    localStorage.setItem("kambus_saved_identifier", identifier);
                    localStorage.setItem("kambus_saved_role", currentRole);
                } else {
                    localStorage.setItem("kambus_remember", "false");
                    localStorage.removeItem("kambus_saved_identifier");
                    localStorage.removeItem("kambus_saved_role");
                }

                notifyUser("ok", "Signed In", "Welcome to KAMBUS.");

                setTimeout(() => {
                    if (currentRole === "student") {
                        window.location.href = "student.html";
                    } else if (currentRole === "driver") {
                        window.location.href = "driver.html";
                    } else if (currentRole === "admin") {
                        window.location.href = "admin.html";
                    }
                }, 150);

            } catch (error) {
                let displayMsg = error.message;
                let displayTitle = "Invalid Credentials";

                if (error.name === "TypeError" || error.message.includes("fetch") || error.message.includes("network")) {
                    displayTitle = "Connection Error";
                    displayMsg = "Please check your internet connection and try again.";
                }

                notifyUser("danger", displayTitle, displayMsg);
                button.disabled = false;
                button.innerHTML = originalButtonContent;
            }
        }

        function notifyUser(type, title, message) {
            if (typeof KambusNotify !== "undefined" && KambusNotify.notify) {
                KambusNotify.notify({ type, title, message });
            }
        }
    </script>
</body>
</html>
