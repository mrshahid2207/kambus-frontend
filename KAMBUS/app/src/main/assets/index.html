<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KAMBUS — Campus Transport OS</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Outfit Premium Typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- KAMBUS Notifications -->
    <link rel="stylesheet" href="notifications.css">
    <script src="notifications.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#F4B942',
                        brandDark: '#E8A317',
                        brandLight: '#FDF3DE',
                        navy: '#172554',
                        surface: '#FFFFFF',
                        slateDark: '#172554'
                    }
                }
            }
        };
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            width: 100%;
        }

        body {
            height: 100%;
            min-height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            width: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            background-color: #F8FAFC;
            background-image:
                radial-gradient(circle at 12% 8%, rgba(244, 185, 66, 0.10), transparent 40%),
                radial-gradient(circle at 88% 92%, rgba(23, 37, 84, 0.06), transparent 45%);
            font-family: 'Outfit', 'Inter', Arial, sans-serif;
            color: #172554;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Auto-Centering Balanced Login Card */
        .login-card {
            width: 100%;
            max-width: 400px;
            margin: auto 0;
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 8px 30px rgba(23, 37, 84, 0.08);
            padding: 30px 24px;
        }

        @media (min-width: 440px) {
            .login-card {
                padding: 38px 32px;
            }
        }

        /* Brand Mark */
        .brand-mark {
            background: linear-gradient(135deg, #FDF3DE, #FBE7BE);
            border: 1px solid rgba(232, 163, 23, 0.28);
        }

        /* Segmented Role Tabs */
        .role-pill-btn {
            transition: all 0.2s ease-in-out;
            color: #64748B;
        }

        .role-pill-btn.active {
            background: linear-gradient(135deg, #F4B942, #E8A317);
            color: #172554;
            box-shadow: 0 4px 14px rgba(232, 163, 23, 0.30);
        }

        .role-pill-btn:not(.active):hover {
            color: #172554;
        }

        /* Input Focus Ring */
        .input-group {
            transition: all 0.2s ease-in-out;
        }

        .input-group:focus-within {
            border-color: #F4B942 !important;
            background-color: #FFFFFF !important;
            box-shadow: 0 0 0 4px rgba(244, 185, 66, 0.15);
        }

        /* Primary CTA Button */
        .btn-primary {
            background: linear-gradient(135deg, #F4B942, #E8A317);
            color: #172554;
            box-shadow: 0 8px 20px rgba(232, 163, 23, 0.22);
            transition: all 0.25s ease;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(232, 163, 23, 0.30);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.85;
            transform: none;
        }
        /* Premium Background Decorative Arcs */
.top-arc,
.bottom-arc {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

.top-arc {
    width: 300px;
    height: 300px;
    border: 28px solid rgba(244, 185, 66, 0.12);
    top: -170px;
    left: -170px;
}

.bottom-arc {
    width: 340px;
    height: 340px;
    border: 32px solid rgba(23, 37, 84, 0.08);
    bottom: -210px;
    right: -210px;
}

/* Keep main card above decorative elements */
.login-card {
    position: relative;
    z-index: 1;
}

/* ---- Premium polish (login) ---- */
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

.login-card { animation: card-in 520ms cubic-bezier(.2, .8, .2, 1) both; }
@keyframes card-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* The real KAMBUS logo, shown as a soft app-icon tile */
.brand-mark {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 28px;
    box-shadow: 0 12px 30px rgba(23, 37, 84, 0.12), 0 0 0 6px rgba(244, 185, 66, 0.10);
}

/* Comfortable touch targets and readable type on phones */
[role="tablist"] .role-pill-btn { min-height: 44px; font-size: 13px; }
.input-group { min-height: 52px; border-radius: 14px; }
.input-group input { font-size: 16px; min-height: 50px; }
.input-group button { right: 2px; min-width: 44px; min-height: 44px; display: grid; place-items: center; font-size: 14px; }
#btnSubmit { min-height: 54px; font-size: 15px; letter-spacing: .01em; }
#btnSubmit:disabled { cursor: progress; }
#loginForm label { font-size: 13px; }
#password { padding-right: 48px; }

/* Wrong-credentials feedback */
.input-group.has-error { border-color: #D23D56 !important; box-shadow: 0 0 0 4px rgba(210, 61, 86, 0.12); }
.input-group.shake { animation: field-shake 380ms cubic-bezier(.36, .07, .19, .97); }
@keyframes field-shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
}

/* Keyboard focus, for hardware keyboards and accessibility tools */
.role-pill-btn:focus-visible, #btnSubmit:focus-visible, .input-group button:focus-visible {
    outline: 3px solid rgba(244, 185, 66, 0.55);
    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
    .login-card, .input-group.shake { animation: none; }
}

    </style>
</head>

<body>
<div class="top-arc"></div>
<div class="bottom-arc"></div>
<!-- Main Login Card -->
<main class="login-card">

    <!-- Brand Header -->
    <header class="text-center mb-6">
        <div class="brand-mark inline-flex items-center justify-center w-28 h-28 mb-4 overflow-hidden">
            <img src="kamlogo.jpg" alt="KAMBUS" class="w-full h-full object-contain">
        </div>
        <h1 class="text-2xl font-bold tracking-tight leading-tight" style="color:#172554;">KAMBUS</h1>
        <p class="text-xs font-medium mt-1" style="color:#64748B;">Campus Transport Operating System</p>
    </header>

    <!-- Segmented Role Selector -->
    <div class="flex bg-slate-100 p-1 rounded-xl mb-5 border border-slate-200/70 gap-1" role="tablist" aria-label="Login Role Selector">
        <button type="button" onclick="setRole('student')" id="tab-student" class="role-pill-btn active flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5" role="tab" aria-selected="true">
            <span>Student</span>
        </button>
        <button type="button" onclick="setRole('driver')" id="tab-driver" class="role-pill-btn flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5" role="tab" aria-selected="false">
            <span>Driver</span>
        </button>
        <button type="button" onclick="setRole('admin')" id="tab-admin" class="role-pill-btn flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5" role="tab" aria-selected="false">
            <span>Admin</span>
        </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4" novalidate>
        <input type="hidden" id="selectedRole" value="student">

        <!-- Identifier Field -->
        <div>
            <label id="identityLabel" for="username" class="block text-xs font-semibold mb-1.5" style="color:#172554;">Student Roll Number</label>
            <div class="input-group relative border border-slate-300 rounded-xl bg-slate-50/50 flex items-center">
                    <span id="identityIcon" class="pl-3.5 text-slate-400 text-xs">
                        <i class="fa-solid fa-id-card"></i>
                    </span>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your roll number" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"
                       class="w-full pl-3 pr-3.5 py-2.5 bg-transparent text-xs sm:text-sm font-semibold focus:outline-none placeholder-slate-400" style="color:#172554;">
            </div>
        </div>

        <!-- Password Field with Visibility Toggle -->
        <div>
            <label for="password" class="block text-xs font-semibold mb-1.5" style="color:#172554;">Password</label>
            <div class="input-group relative border border-slate-300 rounded-xl bg-slate-50/50 flex items-center">
                    <span class="pl-3.5 text-slate-400 text-xs">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password" enterkeyhint="go"
                       class="w-full pl-3 pr-10 py-2.5 bg-transparent text-xs sm:text-sm font-semibold focus:outline-none placeholder-slate-400" style="color:#172554;">
                <button type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" aria-label="Show or hide password" aria-pressed="false" class="absolute right-3 text-slate-400 hover:text-slate-600 p-1 text-xs focus:outline-none">
                    <i id="passwordToggleIcon" class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <!-- Remember Me Option -->
        <div class="flex items-center justify-between pt-0.5">
            <label for="rememberMe" class="flex items-center gap-2 cursor-pointer select-none text-xs font-semibold" style="color:#64748B;">
                <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-slate-300 focus:ring-1" style="accent-color:#E8A317;">
                <span>Remember me</span>
            </label>
        </div>

        <!-- Sign In CTA Button -->
        <button type="submit" id="btnSubmit" class="btn-primary w-full py-3 font-semibold rounded-xl text-xs sm:text-sm flex items-center justify-center gap-2 mt-2" style="border-radius:14px;">
            <span>Sign In to KAMBUS</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
    </form>
    <!-- Security Footer -->
    <footer class="mt-5 pt-3 text-center">
        <p class="text-[11px] font-semibold flex items-center justify-center gap-1.5" style="color:#94A3B8;">
            <i class="fa-solid fa-shield-halved text-xs" style="color:#94A3B8;"></i>
            <span>Secure Campus Authentication</span>
        </p>
    </footer>

</main>

<script>
    const API_BASE = "https://kambus-backend.onrender.com";
    let currentRole = 'student';



    // ========================================
    // INITIALIZATION & RESTORE REMEMBERED SESSION
    // ========================================
    document.addEventListener("DOMContentLoaded", () => {
        const isRemembered = localStorage.getItem("kambus_remember") === "true";
        const savedRole = localStorage.getItem("kambus_saved_role");
        const savedIdentifier = localStorage.getItem("kambus_saved_identifier");
        const rememberCheckbox = document.getElementById("rememberMe");

        if (isRemembered && rememberCheckbox) {
            rememberCheckbox.checked = true;
            if (savedRole) {
                setRole(savedRole);
            }
            if (savedIdentifier) {
                const usernameInput = document.getElementById("username");
                if (usernameInput) usernameInput.value = savedIdentifier;
            }
        }
    });

    // ========================================
    // ROLE SELECTION DYNAMICS
    // ========================================
    function setRole(role) {
        currentRole = role;
        document.getElementById('selectedRole').value = role;

        ['student', 'driver', 'admin'].forEach(r => {
            const tab = document.getElementById(`tab-${r}`);
            if (r === role) {
                tab.className = 'role-pill-btn active flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5';
                tab.setAttribute('aria-selected', 'true');
            } else {
                tab.className = 'role-pill-btn flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5';
                tab.setAttribute('aria-selected', 'false');
            }
        });

        const label = document.getElementById('identityLabel');
        const icon = document.getElementById('identityIcon');
        const usernameInput = document.getElementById('username');

        if (role === 'student') {
            label.innerText = 'Student Roll Number';
            icon.innerHTML = '<i class="fa-solid fa-id-card"></i>';
            usernameInput.placeholder = 'Enter your roll number';
        } else if (role === 'driver') {
            label.innerText = 'Driver Mobile / ID';
            icon.innerHTML = '<i class="fa-solid fa-id-badge"></i>';
            usernameInput.placeholder = 'Enter your mobile number or ID';
        } else {
            label.innerText = 'Admin Username';
            icon.innerHTML = '<i class="fa-solid fa-user-shield"></i>';
            usernameInput.placeholder = 'Enter your admin username';
        }
    }

    // ========================================
    // PASSWORD VISIBILITY TOGGLE
    // ========================================
    function togglePasswordVisibility(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const toggleIcon = document.getElementById(iconId);
        if (!passwordInput || !toggleIcon) return;

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.className = 'fa-solid fa-eye-slash';
        } else {
            passwordInput.type = 'password';
            toggleIcon.className = 'fa-solid fa-eye';
        }
        const toggleButton = toggleIcon.closest('button');
        if (toggleButton) toggleButton.setAttribute('aria-pressed', String(passwordInput.type === 'text'));
    }

    // ========================================
    // LOGIN SUBMISSION WITH HUMANIZED ERRORS
    // ========================================
    async function handleLogin(e) {
        e.preventDefault();

        const identifier = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('rememberMe')?.checked || false;
        const button = document.getElementById('btnSubmit');

        if (!identifier || !password) {
            notifyUser("warning", "Required Fields", "Please enter your username and password.");
            return;
        }

        const originalButtonContent = button.innerHTML;

        button.disabled = true;
        button.innerHTML = `
            <span>Signing in...</span>
            <i class="fa-solid fa-circle-notch fa-spin text-xs ml-1"></i>
        `;

        try {
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    identifier: identifier,
                    password: password,
                    role: currentRole
                })
            });

            const data = await response.json();

            if (!response.ok) {
                let errorTitle = "Invalid credentials";
                let errorMsg = data.detail || "Please check your login details and try again.";

                if (response.status === 403) {
                    errorTitle = "Verification Required";
                    if (currentRole === "student") {
                        errorMsg = "Your email is not verified yet. Please contact your transport administrator.";
                    }
                } else if (response.status >= 500) {
                    errorTitle = "Server unavailable";
                    errorMsg = "Please try again in a few moments.";
                }

                throw new Error(errorMsg);
            }

            if (!data.access_token) {
                throw new Error("Authentication response was incomplete.");
            }

            // Store active session tokens
            localStorage.setItem("kambus_token", data.access_token);
            localStorage.setItem("kambus_role", data.role);
            localStorage.setItem("kambus_user_id", data.user_id);

            // Remember Me persistence
            if (rememberMe) {
                localStorage.setItem("kambus_remember", "true");
                localStorage.setItem("kambus_saved_identifier", identifier);
                localStorage.setItem("kambus_saved_role", currentRole);
            } else {
                localStorage.setItem("kambus_remember", "false");
                localStorage.removeItem("kambus_saved_identifier");
                localStorage.removeItem("kambus_saved_role");
            }

            notifyUser("success", "Signed In", "Welcome to KAMBUS.");

            setTimeout(() => {
                if (currentRole === 'student') {
                    window.location.href = 'student.html';
                } else if (currentRole === 'driver') {
                    window.location.href = 'driver.html';
                } else if (currentRole === 'admin') {
                    window.location.href = 'admin.html';
                }
            }, 150);

        } catch (error) {
            let displayMsg = error.message;
            let displayTitle = "Invalid credentials";

            if (error.name === "TypeError" || error.message.includes("fetch") || error.message.includes("network")) {
                displayTitle = "Unable to connect to KAMBUS";
                displayMsg = "Please check your internet connection and try again.";
            }

            notifyUser("error", displayTitle, displayMsg);
            flagLoginError();

            button.disabled = false;
            button.innerHTML = originalButtonContent;
        }
    }



    function flagLoginError() {
        document.querySelectorAll('.input-group').forEach(group => {
            group.classList.remove('shake');
            void group.offsetWidth; // restart the animation on repeated failures
            group.classList.add('shake', 'has-error');
        });
    }

    document.addEventListener('input', event => {
        if (event.target.closest && event.target.closest('.input-group')) {
            document.querySelectorAll('.input-group').forEach(group => group.classList.remove('has-error'));
        }
    });

    function notifyUser(type, title, message) {
        if (typeof KambusNotify !== "undefined" && KambusNotify.notify) {
            KambusNotify.notify({ type, title, message });
        } else {
            alert(`${title}\n${message}`);
        }
    }
</script>
</body>
</html>
