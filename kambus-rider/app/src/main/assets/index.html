<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>KAMBUS Rider</title>
    <meta name="theme-color" content="#0d222a">
    <meta name="description" content="KAMBUS Rider - Safe Rides, Smarter Campus. Live bus tracking and transport schedules.">
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="favicon.ico?v=2" sizes="48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="kambus.css">
    <script src="kambus-ui.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body.login-page {
            margin: 0;
            padding: 0;
            background-color: #0b1a20;
            background-image: url('rider-login-bg.png');
            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% auto;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .login-viewport {
            width: 100%;
            max-width: 472px;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 18px 28px;
            box-sizing: border-box;
        }
        /* Positions the card precisely where it sits in the mockup */
        .login-card-anchor {
            width: 100%;
            max-width: 396px;
            margin-top: calc(334 / 472 * 100vw);
            margin-bottom: 24px;
            flex-shrink: 0;
            animation: card-enter 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @media (min-width: 472px) {
            .login-card-anchor {
                margin-top: 334px;
            }
        }
        @keyframes card-enter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card {
            position: relative;
            background: #ffffff;
            border-radius: 32px;
            padding: 24px 22px 26px;
            box-shadow: 0 20px 48px rgba(10, 30, 40, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.85);
        }
        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 16px;
            gap: 4px;
            border: 1px solid #e2e8f0;
        }
        .role-tab {
            height: 46px;
            min-height: 46px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 12px;
            font-size: 15px !important;
            font-weight: 600;
            color: #475569 !important;
            background: transparent !important;
            border: 0;
            cursor: pointer;
            transition: all 180ms ease;
        }
        .role-tab svg {
            width: 19px;
            height: 19px;
            stroke: #475569;
            flex-shrink: 0;
            transition: stroke 180ms ease;
        }
        .role-tab.is-active {
            background: #17333f !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(23, 51, 63, 0.25);
        }
        .role-tab.is-active svg {
            stroke: #ffffff !important;
        }
        .field-group {
            margin-top: 16px;
        }
        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #17333f;
            margin-bottom: 7px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            height: 50px;
            min-height: 50px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            padding: 0 14px;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }
        .input-wrap:focus-within {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }
        .input-icon {
            display: flex;
            align-items: center;
            color: #1e293b;
            margin-right: 12px;
            flex-shrink: 0;
            pointer-events: none;
        }
        .login-input {
            flex: 1;
            height: 100%;
            background: transparent;
            border: 0;
            font-size: 15px !important;
            font-weight: 500;
            color: #1e293b;
            padding: 0;
            outline: none;
        }
        .login-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }
        .field-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
            font-weight: 400;
        }
        .phone-prefix {
            display: none;
            align-items: center;
            padding-right: 10px;
            margin-right: 10px;
            border-right: 1.5px solid #cbd5e1;
            color: #17333f;
            font-size: 14px;
            font-weight: 700;
            user-select: none;
        }
        .phone-prefix.is-visible {
            display: flex;
        }
        .pw-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            margin-right: -4px;
            color: #1e293b;
            background: transparent;
            border: 0;
            cursor: pointer;
            border-radius: 8px;
        }
        .pw-toggle-btn:hover {
            color: #0d9488;
        }
        .remember-forgot-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 14px 0 16px;
            user-select: none;
        }
        .remember-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 20px !important;
            height: 20px !important;
            min-width: 20px !important;
            min-height: 20px !important;
            border-radius: 5px;
            border: 1.8px solid #17333f;
            background: #ffffff;
            cursor: pointer;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            flex-shrink: 0;
            transition: all 140ms ease;
        }
        .custom-checkbox:checked {
            background: #17333f;
            border-color: #17333f;
        }
        .custom-checkbox:checked::after {
            content: "";
            width: 5px;
            height: 10px;
            border: solid #ffffff;
            border-width: 0 2.2px 2.2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .remember-text {
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
        }
        .forgot-link {
            font-size: 13px;
            font-weight: 600;
            color: #00838f;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 160ms ease;
        }
        .forgot-link:hover {
            text-decoration: underline;
            opacity: 0.85;
        }
        .signin-btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 52px;
            min-height: 52px !important;
            border-radius: 16px !important;
            background: #17333f !important;
            color: #ffffff !important;
            font-size: 16px !important;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(23, 51, 63, 0.28);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }
        .signin-btn::after {
            content: "";
            position: absolute;
            right: -25px;
            top: -26px;
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: #2b7085;
            pointer-events: none;
            z-index: 1;
        }
        .signin-btn > * {
            position: relative;
            z-index: 2;
        }
        .signin-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 9px 24px rgba(23, 51, 63, 0.35);
        }
        .signin-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .login-divider {
            display: flex;
            align-items: center;
            margin: 18px 0 14px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .login-divider::before, .login-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .login-divider span {
            padding: 0 12px;
        }
        .signup-row {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin: 2px 0 0;
        }
        .register-link {
            color: #00838f;
            font-weight: 700;
            border: 0;
            background: transparent;
            padding: 2px 4px;
            cursor: pointer;
            transition: opacity 160ms ease;
        }
        .register-link:hover {
            text-decoration: underline;
        }
        .login-error {
            display: none;
            align-items: flex-start;
            gap: 8px;
            margin: 0 0 14px;
            padding: 11px 13px;
            border: 1px solid #f0b9b9;
            border-radius: 12px;
            color: #992f2f;
            background: #fff1f1;
            font-size: 13px;
            line-height: 1.35;
        }
        .login-error.visible { display: flex; }
        .login-error svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }

        body.login-page .kambus-toast, body.login-page #kambusNotificationPanel {
            background: rgba(255, 255, 255, .98);
            border-color: #dce7e9;
            border-radius: 14px;
            box-shadow: 0 14px 32px rgba(23, 53, 65, .13);
        }
    </style>
</head>
<body class="login-page">

    <!-- Campus context preserved in DOM for existing JS logic -->
    <div id="campusBadge" style="display: none;" aria-hidden="true">
        <span id="campusName">Signing in to KITS Warangal</span>
    </div>

    <div class="login-viewport">
        <!-- Floating Interactive Card -->
        <main class="login-card-anchor">
            <section class="login-card">
                <!-- Role Selector: Student vs Parent -->
                <div class="role-tabs" id="roleTabs" role="tablist" aria-label="Select login role">
                    <button type="button" class="role-tab is-active" id="tabStudent" data-role="student" role="tab" aria-selected="true" onclick="setRole('student')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        </svg>
                        <span>Student</span>
                    </button>
                    <button type="button" class="role-tab" id="tabParent" data-role="parent" role="tab" aria-selected="false" onclick="setRole('parent')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <span>Parent</span>
                    </button>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                    <!-- Identifier Field -->
                    <div class="field-group">
                        <label id="identityLabel" for="username" class="field-label">Roll number</label>
                        <div class="input-wrap">
                            <div id="phonePrefix" class="phone-prefix">
                                <span style="margin-right: 5px; font-size: 13px;">🇮🇳</span>+91
                            </div>
                            <span id="studentIcon" class="input-icon">
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="16" rx="2"/>
                                    <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                            </span>
                            <input type="text" id="username" name="username" required autocomplete="username"
                                   autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next"
                                   placeholder="e.g. B24CS073"
                                   class="login-input">
                        </div>
                        <p id="identityHint" class="field-hint">Enter your institutional roll number</p>
                    </div>

                    <!-- Password Field -->
                    <div class="field-group">
                        <label for="password" class="field-label">Password</label>
                        <div class="input-wrap">
                            <span class="input-icon">
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                                </svg>
                            </span>
                            <input type="password" id="password" name="password" required autocomplete="current-password"
                                   placeholder="Enter password" enterkeyhint="go"
                                   class="login-input">
                            <button type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" aria-label="Show or hide password" aria-pressed="false" class="pw-toggle-btn">
                                <svg id="passwordToggleIcon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember me & Forgot password row -->
                    <div class="remember-forgot-row">
                        <label for="rememberMe" class="remember-label">
                            <input type="checkbox" id="rememberMe" class="custom-checkbox" checked>
                            <span class="remember-text">Remember me</span>
                        </label>
                        <a href="javascript:void(0)" onclick="handleForgotPassword()" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Error Alert -->
                    <div id="loginError" class="login-error" role="alert" aria-live="polite">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <span></span>
                    </div>

                    <!-- Submit Button with Teal Crescent -->
                    <button type="submit" id="btnSubmit" class="signin-btn">
                        <span>Sign In</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>

                    <!-- OR Divider -->
                    <div class="login-divider">
                        <span>OR</span>
                    </div>

                    <!-- Registration Link -->
                    <p id="signupLinkRow" class="signup-row">
                        New student? <button type="button" onclick="openSignupModal()" class="register-link">Register here</button>
                    </p>
                </form>
            </section>
        </main>
    </div>

    <!-- STUDENT SIGNUP MODAL -->
    <div id="signupModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 border border-slate-200 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-navy">Student Registration</h3>
                <button type="button" onclick="closeSignupModal()" aria-label="Close registration" class="w-10 h-10 flex items-center justify-center text-ink-muted hover:text-navy text-2xl font-bold rounded-lg hover:bg-slate-100 transition-colors">&times;</button>
            </div>
            <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3.5 text-sm">
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Full Name</label>
                    <input type="text" id="regName" required placeholder="Your full name" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Roll Number</label>
                    <input type="text" id="regRoll" required placeholder="e.g. B24CS071" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm uppercase focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Gender</label>
                    <select id="regGender" required class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm bg-white focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Email</label>
                    <input type="email" id="regEmail" required placeholder="student@kitsw.ac.in" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Phone Number</label>
                    <input type="tel" id="regPhone" required placeholder="10-digit phone" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Password</label>
                    <input type="password" id="regPassword" required minlength="6" placeholder="Min 6 characters" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div id="signupMsg" class="hidden text-xs p-2.5 rounded-xl"></div>
                <div class="pt-3 flex gap-3">
                    <button type="button" onclick="closeSignupModal()" class="flex-1 min-h-[48px] bg-slate-100 hover:bg-slate-200 text-navy font-semibold rounded-xl text-sm">Cancel</button>
                    <button type="submit" id="btnRegSubmit" class="flex-1 min-h-[48px] bg-navy hover:bg-navy/90 text-white font-semibold rounded-xl text-sm">Register</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = "https://kambus-backend.onrender.com";
        let currentRole = "student";

        function initCampusBadge() {
            const campusName = localStorage.getItem("kambus_campus_name") || "KITS Warangal";
            const el = document.getElementById("campusName");
            if (el) {
                el.textContent = `Signing in to ${campusName}`;
            }
        }

        function setRole(role) {
            currentRole = role;
            const tabStudent = document.getElementById("tabStudent");
            const tabParent = document.getElementById("tabParent");
            const label = document.getElementById("identityLabel");
            const input = document.getElementById("username");
            const prefix = document.getElementById("phonePrefix");
            const studentIcon = document.getElementById("studentIcon");
            const hint = document.getElementById("identityHint");
            const signupRow = document.getElementById("signupLinkRow");
            const orDivider = document.querySelector(".login-divider");

            hideLoginError();

            if (role === "parent") {
                tabStudent?.classList.remove("is-active");
                tabStudent?.setAttribute("aria-selected", "false");
                tabParent?.classList.add("is-active");
                tabParent?.setAttribute("aria-selected", "true");

                if (label) label.textContent = "Phone number";
                if (prefix) prefix.classList.add("is-visible");
                if (studentIcon) studentIcon.style.display = "none";
                if (input) {
                    input.type = "tel";
                    input.inputMode = "tel";
                    input.maxLength = 10;
                    input.placeholder = "10-digit registered phone";
                    input.autocomplete = "tel";
                    input.autocapitalize = "none";
                }
                if (hint) hint.textContent = "Enter your registered 10-digit mobile number";
                if (signupRow) signupRow.style.display = "none";
                if (orDivider) orDivider.style.display = "none";
            } else {
                tabParent?.classList.remove("is-active");
                tabParent?.setAttribute("aria-selected", "false");
                tabStudent?.classList.add("is-active");
                tabStudent?.setAttribute("aria-selected", "true");

                if (label) label.textContent = "Roll number";
                if (prefix) prefix.classList.remove("is-visible");
                if (studentIcon) studentIcon.style.display = "flex";
                if (input) {
                    input.type = "text";
                    input.inputMode = "text";
                    input.removeAttribute("maxlength");
                    input.placeholder = "e.g. B24CS073";
                    input.autocomplete = "username";
                    input.autocapitalize = "characters";
                }
                if (hint) hint.textContent = "Enter your institutional roll number";
                if (signupRow) signupRow.style.display = "block";
                if (orDivider) orDivider.style.display = "flex";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initCampusBadge();

            const isRemembered = localStorage.getItem("kambus_remember");
            const savedIdentifier = localStorage.getItem("kambus_saved_identifier");
            const savedRole = localStorage.getItem("kambus_saved_role");
            const rememberCheckbox = document.getElementById("rememberMe");

            if (savedRole === "parent") {
                setRole("parent");
            } else {
                setRole("student");
            }

            if (isRemembered === "false" && rememberCheckbox) {
                rememberCheckbox.checked = false;
            } else if (rememberCheckbox) {
                rememberCheckbox.checked = true;
                if (savedIdentifier) {
                    const usernameInput = document.getElementById("username");
                    if (usernameInput) usernameInput.value = savedIdentifier;
                }
            }
        });

        function showLoginError(message) {
            const banner = document.getElementById("loginError");
            if (!banner) return;
            banner.querySelector("span").textContent = message;
            banner.classList.add("visible");
        }

        function hideLoginError() {
            const banner = document.getElementById("loginError");
            if (banner) banner.classList.remove("visible");
        }

        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            if (!passwordInput || !toggleIcon) return;

            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            if (isPassword) {
                toggleIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
            } else {
                toggleIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
            const toggleButton = toggleIcon.closest("button");
            if (toggleButton) toggleButton.setAttribute("aria-pressed", String(isPassword));
        }

        function handleForgotPassword() {
            notifyUser("info", "Password Reset", "Please contact your campus transport administrator to reset your password.");
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideLoginError();

            let identifier = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const rememberMe = document.getElementById("rememberMe")?.checked || false;
            const button = document.getElementById("btnSubmit");

            if (!identifier || !password) {
                const fieldName = currentRole === "student" ? "roll number" : "phone number";
                notifyUser("warn", "Required Fields", `Please enter your ${fieldName} and password.`);
                return;
            }

            // Clean phone number prefix if parent entered +91 or spaces
            if (currentRole === "parent") {
                const digits = identifier.replace(/\D/g, "");
                if (digits.length === 12 && digits.startsWith("91")) {
                    identifier = digits.slice(2);
                } else if (digits.length === 10) {
                    identifier = digits;
                }
            }

            const originalButtonContent = button.innerHTML;
            button.disabled = true;
            button.innerHTML = `
                <span>Signing In...</span>
                <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="16"/>
                </svg>
            `;

            try {
                let response = await fetch(`${API_BASE}/auth/login/rider`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password
                    })
                });

                // Fallback while remote backend is completing its redeploy
                if (response.status === 404) {
                    response = await fetch(`${API_BASE}/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ identifier: identifier, password: password, role: currentRole })
                    });
                    if (response.status === 401) {
                        const fallbackRole = currentRole === "student" ? "parent" : "student";
                        const altTry = await fetch(`${API_BASE}/auth/login`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ identifier: identifier, password: password, role: fallbackRole })
                        });
                        if (altTry.ok) {
                            response = altTry;
                        }
                    }
                }

                const data = await response.json();

                if (!response.ok) {
                    let errorTitle = "Invalid Credentials";
                    let errorMsg = data.detail || "Please check your login details and try again.";

                    if (response.status === 403) {
                        errorTitle = "Verification Required";
                        errorMsg = data.detail || "Your account is not verified yet. Please contact your transport administrator.";
                    } else if (response.status === 429) {
                        errorTitle = "Too Many Attempts";
                        errorMsg = data.detail || "Account temporarily locked. Please try again later.";
                    } else if (response.status >= 500) {
                        errorTitle = "Server Unavailable";
                        errorMsg = "Please try again in a few moments.";
                    }

                    throw new Error(errorMsg);
                }

                if (!data.access_token) {
                    throw new Error("Authentication response was incomplete.");
                }

                localStorage.setItem("kambus_token", data.access_token);
                localStorage.setItem("kambus_role", data.role);
                localStorage.setItem("kambus_user_id", data.user_id);
                if (data.student) {
                    localStorage.setItem("kambus_student_dashboard", JSON.stringify(data.student));
                }

                if (rememberMe) {
                    localStorage.setItem("kambus_remember", "true");
                    localStorage.setItem("kambus_saved_identifier", identifier);
                    localStorage.setItem("kambus_saved_role", currentRole);
                } else {
                    localStorage.setItem("kambus_remember", "false");
                    localStorage.removeItem("kambus_saved_identifier");
                    localStorage.removeItem("kambus_saved_role");
                }

                notifyUser("ok", "Signed In", "Welcome to KAMBUS.");

                setTimeout(() => {
                    if (data.role === "student") {
                        window.location.href = "student.html";
                    } else if (data.role === "parent") {
                        window.location.href = "parent.html";
                    } else {
                        window.location.href = currentRole === "parent" ? "parent.html" : "student.html";
                    }
                }, 150);

            } catch (error) {
                let displayMsg = error.message;
                let displayTitle = "Invalid Credentials";

                if (error.name === "TypeError" || error.message.includes("fetch") || error.message.includes("network")) {
                    displayTitle = "Connection Error";
                    displayMsg = "Please check your internet connection and try again.";
                }

                notifyUser("danger", displayTitle, displayMsg);
                showLoginError(displayMsg);
                button.disabled = false;
                button.innerHTML = originalButtonContent;
            }
        }

        function notifyUser(type, title, message) {
            if (typeof KambusNotify !== "undefined" && KambusNotify.notify) {
                KambusNotify.notify({ type, title, message });
            }
        }

        function openSignupModal() {
            document.getElementById("signupModal")?.classList.remove("hidden");
        }

        function closeSignupModal() {
            document.getElementById("signupModal")?.classList.add("hidden");
            const msg = document.getElementById("signupMsg");
            if (msg) { msg.classList.add("hidden"); msg.textContent = ""; }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById("btnRegSubmit");
            const msg = document.getElementById("signupMsg");
            const name = document.getElementById("regName").value.trim();
            const rollNumber = document.getElementById("regRoll").value.trim().toUpperCase();
            const gender = document.getElementById("regGender").value;
            const email = document.getElementById("regEmail").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const password = document.getElementById("regPassword").value;

            if (!gender) {
                msg.className = "text-xs p-2 rounded-lg bg-rose-50 text-rose-700 block";
                msg.textContent = "Please select your gender.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Registering...";
            msg.classList.add("hidden");

            try {
                const res = await fetch(`${API_BASE}/auth/student/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, roll_number: rollNumber, gender, email, phone, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Registration failed");

                msg.className = "text-xs p-2 rounded-lg bg-emerald-50 text-emerald-700 block";
                msg.textContent = data.message || "Registration submitted! Check email for OTP.";
                setTimeout(() => {
                    closeSignupModal();
                    notifyUser("ok", "Account Created", "Please verify your account to sign in.");
                }, 1500);
            } catch (err) {
                msg.className = "text-xs p-2 rounded-lg bg-rose-50 text-rose-700 block";
                msg.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "Register";
            }
        }
    </script>
