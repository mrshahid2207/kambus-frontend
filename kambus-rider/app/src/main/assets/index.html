<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>KAMBUS Rider</title>
    <meta name="theme-color" content="#173541">
    <meta name="description" content="KAMBUS Rider, live bus tracking for KITSW.">
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="favicon.ico?v=2" sizes="48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="kambus.css">
    <script src="kambus-ui.js"></script>
    <style>
        body.login-page { position:relative; overflow-x:hidden; overflow-y:auto; background:#fff; min-height:100vh; justify-content:flex-start; padding:96px 0 104px; padding-top:max(96px, calc(16px + max(var(--safe-top, 0px), env(safe-area-inset-top, 0px)))); padding-bottom:calc(104px + max(var(--safe-bottom, 0px), env(safe-area-inset-bottom, 0px))); }
        body.login-page input { scroll-margin-top:24px; scroll-margin-bottom:24px; }
        body.login-page::before, body.login-page::after { content:""; position:fixed; z-index:0; width:150vw; pointer-events:none; }
        body.login-page::before { top:-126px; left:-25vw; height:212px; border-radius:0 0 50% 50%; background:radial-gradient(ellipse at 50% 100%, rgba(91,157,179,.28), transparent 58%), linear-gradient(135deg, #10303c, #1d4a5a); box-shadow:0 8px 28px rgba(23,53,65,.12); }
        body.login-page::after { bottom:-146px; right:-29vw; height:238px; border-radius:50% 50% 0 0; background:radial-gradient(ellipse at 50% 0%, rgba(111,183,204,.34), transparent 60%), linear-gradient(135deg, #174251, #0f2b36); box-shadow:0 -8px 28px rgba(23,53,65,.08); }
        .login-shell { position:relative; z-index:1; width:calc(100% - 32px); max-width:420px; flex-shrink:0; margin:auto 0; animation:login-enter 220ms ease-out both; }
        .login-card { position:relative; padding:24px; background:#fff; border:1px solid #e2e8f0; border-radius:24px; box-shadow:0 12px 32px rgba(23,53,65,.10); }
        .login-brand { display:flex; align-items:center; justify-content:center; margin-bottom:25px; }.login-crest { width:58px!important; height:58px!important; border-radius:50%; object-fit:cover; box-shadow:0 7px 18px rgba(23,53,65,.16); }.login-wordmark { height:23px!important; }.login-brand > div { gap:0!important; }
        .role-tabs { --role-position: 0; position:relative; display:grid; grid-template-columns:repeat(2,1fr); gap:2px; padding:4px; border:1px solid #dce5e8; border-radius:14px; background:#edf2f3; }.role-indicator { position:absolute; top:4px; bottom:4px; left:4px; width:calc((100% - 8px)/2); border-radius:10px; background:linear-gradient(135deg,#173541,#285466); box-shadow:0 3px 8px rgba(23,53,65,.2); transform:translateX(calc(var(--role-position)*100%)); transition:transform 230ms cubic-bezier(.2,.8,.2,1); }.role-tab { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:5px; min-height:36px!important; padding:7px 3px!important; border:0; border-radius:10px; color:#66767d; background:transparent; font-size:11px!important; font-weight:600; transition:color 160ms ease; }.role-tab.is-active { color:#fff!important; }.role-tab svg { width:13px; height:13px; }
        .login-input { height:46px; border-radius:12px!important; background:#f7fafb!important; transition:border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease; }.login-input:focus { border-color:#4e9ab5!important; background:#fff!important; box-shadow:0 0 0 4px rgba(78,154,181,.15); }.login-error { display:none; align-items:flex-start; gap:8px; margin:0 0 14px; padding:10px 11px; border:1px solid #f0b9b9; border-radius:11px; color:#992f2f; background:#fff1f1; font-size:12px; line-height:1.35; }.login-error.visible { display:flex; }.login-error svg { width:15px; height:15px; flex:none; margin-top:1px; }.remember-row { margin:2px 0 16px; font-size:10px!important; line-height:1!important; color:#71868e!important; }.remember-row input { width:12px!important; height:12px!important; min-width:12px!important; min-height:12px!important; }.remember-row span { font-size:10px; }
        #btnSubmit { min-height:47px; border-radius:13px!important; background:linear-gradient(135deg,#173541,#285466)!important; box-shadow:0 8px 16px rgba(23,53,65,.26); transition:transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease; }#btnSubmit:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 11px 20px rgba(23,53,65,.32); }.login-footer { display:flex; align-items:center; justify-content:center; gap:9px; margin:8px 0 0; color:#547681; text-align:center; font-size:10px; letter-spacing:.08em; font-weight:600; }.login-footer::before,.login-footer::after { content:""; height:1px; flex:1; background:linear-gradient(90deg, transparent, #a9cbd5); }.login-footer::after { background:linear-gradient(90deg, #a9cbd5, transparent); } body.login-page .kambus-toast, body.login-page #kambusNotificationPanel { background:rgba(255,255,255,.98); border-color:#dce7e9; border-radius:14px; box-shadow:0 14px 32px rgba(23,53,65,.13); } @keyframes login-enter { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } } @media(max-width:380px) { body.login-page::before { top:-142px; }.role-tab { font-size:10px!important; }.role-tab svg { display:none; } }
        @media (max-height:700px) { .login-brand { margin-bottom:12px; } .role-tabs { margin-bottom:8px; } }
    </style>
</head>
<body class="login-page text-navy font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <main class="login-shell">
      <section class="login-card">
        <header class="login-brand">
            <img src="brand/kitsw-crest.png" alt="Kakatiya Institute of Technology and Science, Warangal" class="login-crest">
            <div><img src="brand/wordmark-navy.svg" alt="KAMBUS" class="login-wordmark"></div>
        </header>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4" novalidate>
            <div>
                <label for="campusSelect" class="block text-xs font-semibold mb-1.5 text-navy">Campus / Institution</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-ink-muted flex items-center pointer-events-none">
                        <svg class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-map-pin"/></svg>
                    </span>
                    <select id="campusSelect" onchange="handleCampusSelectionChange(this.value)"
                            class="login-input w-full pl-9 pr-3 py-2 border border-line text-xs font-semibold text-navy bg-white focus:outline-none">
                        <option value="">Loading campuses...</option>
                    </select>
                </div>
            </div>

            <div>
                <label id="identityLabel" for="username" class="block text-xs font-semibold mb-1.5 text-navy">Roll Number, Phone or ID</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-ink-muted flex items-center pointer-events-none">
                        <svg class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-id-card"/></svg>
                    </span>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter roll number, phone or ID" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"
                           class="login-input w-full pl-9 pr-3 py-2 border border-line text-sm text-navy placeholder-ink-muted focus:outline-none">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold mb-1.5 text-navy">Password</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-ink-muted flex items-center pointer-events-none">
                        <svg class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-lock"/></svg>
                    </span>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password" enterkeyhint="go"
                           class="login-input w-full pl-9 pr-10 py-2 border border-line text-sm text-navy placeholder-ink-muted focus:outline-none">
                    <button type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" aria-label="Show or hide password" aria-pressed="false" class="absolute right-2.5 text-ink-muted hover:text-navy p-1 focus:outline-none">
                        <svg id="passwordToggleIcon" class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-eye"/></svg>
                    </button>
                </div>
            </div>
            <label for="rememberMe" class="remember-row flex items-center gap-1.5 w-fit cursor-pointer select-none">
                <input type="checkbox" id="rememberMe" class="w-3.5 h-3.5 rounded-sm border-line text-navy accent-navy">
                <span>Remember me</span>
            </label>

            <div id="loginError" class="login-error" role="alert" aria-live="polite"><svg aria-hidden="true"><use href="icons.svg#icon-alert"/></svg><span></span></div>
            <button type="submit" id="btnSubmit" class="w-full py-2.5 px-4 text-white text-sm font-semibold flex items-center justify-center gap-2 disabled:opacity-60">
                <span>Sign In</span>
                <svg class="w-4 h-4" aria-hidden="true"><use href="icons.svg#icon-arrow-right"/></svg>
            </button>
            <p id="signupLinkRow" class="text-center text-xs text-ink-muted mt-3">
                New student? <button type="button" onclick="openSignupModal()" class="text-brand font-semibold hover:underline">Register here</button>
            </p>
            <p id="schoolNoticeRow" class="hidden text-center text-[11px] text-ink-muted mt-3 bg-amber-50/70 border border-amber-200/80 rounded-lg p-2 text-amber-900">
                🏫 School transport is managed via parent accounts. Contact your school transport office for enrollment.
            </p>
        </form>
      </section><p id="loginFooterCampus" class="login-footer">KITS Warangal &middot; KAMBUS</p>
    </main>


    <!-- STUDENT SIGNUP MODAL -->
    <div id="signupModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 border border-slate-200 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-base font-semibold text-navy">Student Registration</h3>
                <button type="button" onclick="closeSignupModal()" class="text-ink-muted hover:text-navy text-lg font-bold">&times;</button>
            </div>
            <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-navy mb-1">Full Name</label>
                    <input type="text" id="regName" required placeholder="Your full name" class="login-input w-full px-3 py-2 border border-line rounded">
                </div>
                <div>
                    <label class="block font-semibold text-navy mb-1">Roll Number</label>
                    <input type="text" id="regRoll" required placeholder="e.g. 21KIT123" class="login-input w-full px-3 py-2 border border-line rounded uppercase">
                </div>
                <div>
                    <label class="block font-semibold text-navy mb-1">Gender</label>
                    <select id="regGender" required class="login-input w-full px-3 py-2 border border-line rounded bg-white">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-navy mb-1">Email</label>
                    <input type="email" id="regEmail" required placeholder="student@kitsw.ac.in" class="login-input w-full px-3 py-2 border border-line rounded">
                </div>
                <div>
                    <label class="block font-semibold text-navy mb-1">Phone Number</label>
                    <input type="tel" id="regPhone" required placeholder="10-digit phone" class="login-input w-full px-3 py-2 border border-line rounded">
                </div>
                <div>
                    <label class="block font-semibold text-navy mb-1">Password</label>
                    <input type="password" id="regPassword" required minlength="6" placeholder="Min 6 characters" class="login-input w-full px-3 py-2 border border-line rounded">
                </div>
                <div id="signupMsg" class="hidden text-xs p-2 rounded"></div>
                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeSignupModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-navy font-semibold rounded">Cancel</button>
                    <button type="submit" id="btnRegSubmit" class="flex-1 py-2 bg-navy hover:bg-navy/90 text-white font-semibold rounded">Register</button>
                </div>
            </form>
        </div>
    </div>


    <script>
        const API_BASE = "https://kambus-backend.onrender.com";
        let activeCampuses = [];

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadCampuses();

            const isRemembered = localStorage.getItem("kambus_remember") === "true";
            const savedIdentifier = localStorage.getItem("kambus_saved_identifier");
            const rememberCheckbox = document.getElementById("rememberMe");

            if (isRemembered && rememberCheckbox) {
                rememberCheckbox.checked = true;
                if (savedIdentifier) {
                    const usernameInput = document.getElementById("username");
                    if (usernameInput) usernameInput.value = savedIdentifier;
                }
            }
        });

        async function loadCampuses() {
            const select = document.getElementById("campusSelect");
            if (!select) return;

            try {
                const res = await fetch(`${API_BASE}/auth/campuses`);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        activeCampuses = data;
                        renderCampusOptions(data);
                        return;
                    }
                }
            } catch (err) {
                console.warn("Could not load campuses from API, using default fallback", err);
            }

            // Fallback default if offline or initial load
            activeCampuses = [{ id: 1, name: "KITS Warangal", slug: "kitsw", campus_type: "college" }];
            renderCampusOptions(activeCampuses);
        }

        function renderCampusOptions(campuses) {
            const select = document.getElementById("campusSelect");
            if (!select) return;

            const savedCampusId = localStorage.getItem("kambus_rider_campus_id");
            select.innerHTML = campuses.map(c => {
                const typeIcon = (c.campus_type === "school" || c.type === "school") ? "🏫 School" : "🎓 College";
                return `<option value="${c.id}">${escapeHtml(c.name)} (${typeIcon})</option>`;
            }).join("");

            if (savedCampusId && campuses.some(c => String(c.id) === String(savedCampusId))) {
                select.value = String(savedCampusId);
            } else if (campuses.length > 0) {
                select.value = String(campuses[0].id);
            }
            handleCampusSelectionChange(select.value);
        }

        function handleCampusSelectionChange(campusId) {
            const parsedId = campusId ? parseInt(campusId, 10) : 1;
            localStorage.setItem("kambus_rider_campus_id", String(parsedId));

            const campus = activeCampuses.find(c => c.id === parsedId) || activeCampuses[0];
            const isSchool = campus ? (campus.campus_type === "school" || campus.type === "school") : false;

            const signupRow = document.getElementById("signupLinkRow");
            const schoolNotice = document.getElementById("schoolNoticeRow");
            const identityLabel = document.getElementById("identityLabel");
            const usernameInput = document.getElementById("username");
            const footerCampus = document.getElementById("loginFooterCampus");

            if (isSchool) {
                // School campus: HIDE student self-registration outright
                if (signupRow) signupRow.classList.add("hidden");
                if (schoolNotice) schoolNotice.classList.remove("hidden");
                if (identityLabel) identityLabel.textContent = "Phone Number or Parent ID";
                if (usernameInput) usernameInput.placeholder = "Enter registered phone or parent ID";
            } else {
                // College campus: SHOW student registration
                if (signupRow) signupRow.classList.remove("hidden");
                if (schoolNotice) schoolNotice.classList.add("hidden");
                if (identityLabel) identityLabel.textContent = "Roll Number, Phone or ID";
                if (usernameInput) usernameInput.placeholder = "Enter roll number, phone or ID";
            }

            if (footerCampus && campus) {
                footerCampus.textContent = `${campus.name} · KAMBUS`;
            }
        }

        function showLoginError(message) {
            const banner = document.getElementById("loginError");
            banner.querySelector("span").textContent = message;
            banner.classList.add("visible");
        }

        function hideLoginError() {
            document.getElementById("loginError").classList.remove("visible");
        }

        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            if (!passwordInput || !toggleIcon) return;

            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            toggleIcon.innerHTML = `<use href="icons.svg#icon-${isPassword ? 'eye-slash' : 'eye'}"/>`;
            const toggleButton = toggleIcon.closest("button");
            if (toggleButton) toggleButton.setAttribute("aria-pressed", String(isPassword));
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideLoginError();

            const identifier = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const rememberMe = document.getElementById("rememberMe")?.checked || false;
            const button = document.getElementById("btnSubmit");

            const campusSelect = document.getElementById("campusSelect");
            const selectedCampusId = campusSelect && campusSelect.value ? parseInt(campusSelect.value, 10) : 1;

            if (!identifier || !password) {
                notifyUser("warn", "Required Fields", "Please enter your identifier and password.");
                return;
            }

            const originalButtonContent = button.innerHTML;
            button.disabled = true;
            button.innerHTML = `
                <span>Signing In...</span>
                <svg class="w-4 h-4 animate-spin" aria-hidden="true"><use href="icons.svg#icon-spinner"/></svg>
            `;

            try {
                let response = await fetch(`${API_BASE}/auth/login/rider`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password,
                        campus_id: selectedCampusId
                    })
                });

                // Fallback while remote backend is completing its redeploy
                if (response.status === 404) {
                    response = await fetch(`${API_BASE}/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ identifier: identifier, password: password, role: "student", campus_id: selectedCampusId })
                    });
                    if (response.status === 401) {
                        const parentTry = await fetch(`${API_BASE}/auth/login`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ identifier: identifier, password: password, role: "parent", campus_id: selectedCampusId })
                        });
                        if (parentTry.ok) {
                            response = parentTry;
                        }
                    }
                }

                const data = await response.json();

                if (!response.ok) {
                    let errorTitle = "Invalid Credentials";
                    let errorMsg = data.detail || "Please check your login details and try again.";

                    if (response.status === 403) {
                        errorTitle = "Verification Required";
                        errorMsg = data.detail || "Your email is not verified yet. Please contact your transport administrator.";
                    } else if (response.status === 429) {
                        errorTitle = "Too Many Attempts";
                        errorMsg = data.detail || "Account temporarily locked. Please try again later.";
                    } else if (response.status >= 500) {
                        errorTitle = "Server Unavailable";
                        errorMsg = "Please try again in a few moments.";
                    }

                    throw new Error(errorMsg);
                }

                if (!data.access_token) {
                    throw new Error("Authentication response was incomplete.");
                }

                localStorage.setItem("kambus_token", data.access_token);
                localStorage.setItem("kambus_role", data.role);
                localStorage.setItem("kambus_user_id", data.user_id);
                localStorage.setItem("kambus_active_campus_id", String(selectedCampusId));

                if (rememberMe) {
                    localStorage.setItem("kambus_remember", "true");
                    localStorage.setItem("kambus_saved_identifier", identifier);
                    localStorage.setItem("kambus_saved_role", data.role);
                } else {
                    localStorage.setItem("kambus_remember", "false");
                    localStorage.removeItem("kambus_saved_identifier");
                    localStorage.removeItem("kambus_saved_role");
                }

                notifyUser("ok", "Signed In", "Welcome to KAMBUS.");

                setTimeout(() => {
                    if (data.role === "student") {
                        window.location.href = "student.html";
                    } else if (data.role === "parent") {
                        window.location.href = "parent.html";
                    }
                }, 150);

            } catch (error) {
                let displayMsg = error.message;
                let displayTitle = "Invalid Credentials";

                if (error.name === "TypeError" || error.message.includes("fetch") || error.message.includes("network")) {
                    displayTitle = "Connection Error";
                    displayMsg = "Please check your internet connection and try again.";
                }

                notifyUser("danger", displayTitle, displayMsg);
                showLoginError(displayMsg);
                button.disabled = false;
                button.innerHTML = originalButtonContent;
            }
        }

        function notifyUser(type, title, message) {
            if (typeof KambusNotify !== "undefined" && KambusNotify.notify) {
                KambusNotify.notify({ type, title, message });
            }
        }

        function openSignupModal() {
            const campusSelect = document.getElementById("campusSelect");
            const selectedCampusId = campusSelect && campusSelect.value ? parseInt(campusSelect.value, 10) : 1;
            const campus = activeCampuses.find(c => c.id === selectedCampusId);
            if (campus && (campus.campus_type === "school" || campus.type === "school")) {
                notifyUser("warn", "Registration Restricted", "Student self-registration is disabled for school campuses. Contact your school transport office.");
                return;
            }
            document.getElementById("signupModal")?.classList.remove("hidden");
        }

        function closeSignupModal() {
            document.getElementById("signupModal")?.classList.add("hidden");
            const msg = document.getElementById("signupMsg");
            if (msg) { msg.classList.add("hidden"); msg.textContent = ""; }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById("btnRegSubmit");
            const msg = document.getElementById("signupMsg");
            const name = document.getElementById("regName").value.trim();
            const rollNumber = document.getElementById("regRoll").value.trim().toUpperCase();
            const gender = document.getElementById("regGender").value;
            const email = document.getElementById("regEmail").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const password = document.getElementById("regPassword").value;

            const campusSelect = document.getElementById("campusSelect");
            const selectedCampusId = campusSelect && campusSelect.value ? parseInt(campusSelect.value, 10) : 1;

            if (!gender) {
                msg.className = "text-xs p-2 rounded bg-rose-50 text-rose-700 block";
                msg.textContent = "Please select your gender.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Registering...";
            msg.classList.add("hidden");

            try {
                const res = await fetch(`${API_BASE}/auth/student/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name,
                        roll_number: rollNumber,
                        gender,
                        email,
                        phone,
                        password,
                        campus_id: selectedCampusId
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Registration failed");

                msg.className = "text-xs p-2 rounded bg-emerald-50 text-emerald-700 block";
                msg.textContent = data.message || "Registration submitted! Check email for OTP.";
                setTimeout(() => {
                    closeSignupModal();
                    notifyUser("ok", "Account Created", "Please verify your account to sign in.");
                }, 1500);
            } catch (err) {
                msg.className = "text-xs p-2 rounded bg-rose-50 text-rose-700 block";
                msg.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "Register";
            }
        }
    </script>
</body>
</html>
