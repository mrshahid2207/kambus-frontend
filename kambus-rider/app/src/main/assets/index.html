<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>KAMBUS Rider</title>
    <meta name="theme-color" content="#17333f">
    <meta name="description" content="KAMBUS Rider, live bus tracking and transport schedules.">
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="favicon.ico?v=2" sizes="48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="kambus.css">
    <script src="kambus-ui.js"></script>
    <style>
        body.login-page {
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            background: #f8fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            padding-top: max(24px, calc(16px + max(var(--safe-top, 0px), env(safe-area-inset-top, 0px))));
            padding-bottom: max(24px, calc(16px + max(var(--safe-bottom, 0px), env(safe-area-inset-bottom, 0px))));
        }
        body.login-page input { scroll-margin-top: 24px; scroll-margin-bottom: 24px; }
        /* Subtle decorative brand curves: reduced to ~1/3 original height */
        body.login-page::before, body.login-page::after {
            content: "";
            position: fixed;
            z-index: 0;
            width: 140vw;
            pointer-events: none;
        }
        body.login-page::before {
            top: -46px;
            left: -20vw;
            height: 72px;
            border-radius: 0 0 50% 50%;
            background: radial-gradient(ellipse at 50% 100%, rgba(79, 179, 169, 0.4), transparent 70%), linear-gradient(135deg, #17333f, #224c5b);
            box-shadow: 0 4px 16px rgba(23, 51, 63, 0.12);
        }
        body.login-page::after {
            bottom: -46px;
            right: -20vw;
            height: 72px;
            border-radius: 50% 50% 0 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(79, 179, 169, 0.35), transparent 70%), linear-gradient(135deg, #224c5b, #17333f);
            box-shadow: 0 -4px 16px rgba(23, 51, 63, 0.08);
        }
        .login-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            flex-shrink: 0;
            margin: auto 0;
            animation: login-enter 220ms ease-out both;
        }
        .login-card {
            position: relative;
            padding: 26px 24px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(23, 53, 65, 0.08);
        }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .campus-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
            color: #475569;
            letter-spacing: 0.01em;
        }
        .campus-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4fb3a9;
            flex-shrink: 0;
        }
        .role-tabs {
            --role-position: 0;
            position: relative;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3px;
            padding: 4px;
            border: 1px solid #dce5e8;
            border-radius: 14px;
            background: #edf2f3;
        }
        .role-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc((100% - 8px) / 2);
            border-radius: 10px;
            background: linear-gradient(135deg, #17333f, #285466);
            box-shadow: 0 3px 8px rgba(23, 53, 65, 0.2);
            transform: translateX(calc(var(--role-position) * 100%));
            transition: transform 230ms cubic-bezier(.2, .8, .2, 1);
        }
        .role-tab {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px !important;
            padding: 8px 12px !important;
            border: 0;
            border-radius: 10px;
            color: #66767d;
            background: transparent;
            font-size: 14px !important;
            font-weight: 600;
            cursor: pointer;
            transition: color 160ms ease;
        }
        .role-tab.is-active {
            color: #fff !important;
        }
        .role-tab svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .input-wrap {
            height: 52px;
            min-height: 52px;
        }
        .phone-prefix {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            font-size: 14px !important;
        }
        .login-input {
            height: 100%;
            font-size: 16px !important;
        }
        .login-error {
            display: none;
            align-items: flex-start;
            gap: 8px;
            margin: 0 0 14px;
            padding: 11px 13px;
            border: 1px solid #f0b9b9;
            border-radius: 12px;
            color: #992f2f;
            background: #fff1f1;
            font-size: 13px;
            line-height: 1.35;
        }
        .login-error.visible { display: flex; }
        .login-error svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
        input[type="checkbox"] {
            min-width: 18px !important;
            min-height: 18px !important;
            width: 18px !important;
            height: 18px !important;
            accent-color: #17333f;
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
        }
        .remember-row {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 2px 0 14px;
            font-size: 14px !important;
            color: #475569 !important;
            cursor: pointer;
            user-select: none;
        }
        #btnSubmit {
            min-height: 52px !important;
            border-radius: 14px !important;
            font-size: 16px !important;
            font-weight: 600;
            background: linear-gradient(135deg, #17333f, #285466) !important;
            box-shadow: 0 6px 16px rgba(23, 51, 63, 0.22);
            transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
        }
        #btnSubmit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 9px 20px rgba(23, 51, 63, 0.28);
        }
        #btnSubmit:active:not(:disabled) {
            transform: scale(0.98);
        }
        .login-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin: 16px 0 0;
            color: #64748b;
            text-align: center;
            font-size: 11px;
            letter-spacing: .08em;
            font-weight: 600;
        }
        .login-footer::before, .login-footer::after {
            content: "";
            height: 1px;
            flex: 1;
            background: linear-gradient(90deg, transparent, #cbd5e1);
        }
        .login-footer::after {
            background: linear-gradient(90deg, #cbd5e1, transparent);
        }
        body.login-page .kambus-toast, body.login-page #kambusNotificationPanel {
            background: rgba(255, 255, 255, .98);
            border-color: #dce7e9;
            border-radius: 14px;
            box-shadow: 0 14px 32px rgba(23, 53, 65, .13);
        }
        @keyframes login-enter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 380px) {
            .login-card { padding: 22px 18px; }
        }
        @media (max-height: 660px) {
            body.login-page { padding: 12px 14px; }
            .login-brand { margin-bottom: 14px; }
            .role-tabs { margin-bottom: 12px; }
        }
    </style>
</head>
<body class="login-page text-navy font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Inline SVG sprite for guaranteed rendering on file:/// and WebViews -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;" aria-hidden="true">
        <defs>
            <symbol id="icon-user-graduate" viewBox="0 0 24 24">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
                <path d="M6 12v5c3 3 9 3 12 0v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
            </symbol>
            <symbol id="icon-users" viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-3-3.87" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
                <path d="M7 21v-2a4 4 0 0 1 3-3.87" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
                <circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
                <circle cx="16" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
            </symbol>
            <symbol id="icon-id-card" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
                <line x1="2" y1="10" x2="22" y2="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
            </symbol>
            <symbol id="icon-phone" viewBox="0 0 24 24">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
            </symbol>
            <symbol id="icon-lock" viewBox="0 0 24 24">
                <rect x="5" y="11" width="14" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
            </symbol>
            <symbol id="icon-eye" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            </symbol>
            <symbol id="icon-eye-slash" viewBox="0 0 24 24">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
                <line x1="1" y1="1" x2="23" y2="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
            </symbol>
            <symbol id="icon-alert" viewBox="0 0 24 24">
                <polygon points="12 2 1 21 23 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
                <line x1="12" y1="9" x2="12" y2="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
                <line x1="12" y1="17" x2="12.01" y2="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
            </symbol>
            <symbol id="icon-arrow-right" viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
                <polyline points="12 5 19 12 12 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
            </symbol>
            <symbol id="icon-spinner" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="32" stroke-dashoffset="16"/>
            </symbol>
        </defs>
    </svg>

    <main class="login-shell">
      <section class="login-card">
        <header class="login-brand">
            <div class="flex items-center justify-center gap-2.5 mb-2.5">
                <img src="kambus-logo.svg" alt="KAMBUS Mark" class="w-11 h-11 rounded-xl shadow-xs">
                <img src="brand/wordmark-navy.svg" alt="KAMBUS" class="h-6 w-auto">
            </div>
            <div id="campusBadge" class="campus-badge" title="Active campus context">
                <span class="campus-dot" aria-hidden="true"></span>
                <span id="campusName">Signing in to KITS Warangal</span>
            </div>
        </header>

        <!-- Role Selector: Student (roll number) vs Parent (phone) -->
        <div class="role-tabs mb-4" id="roleTabs" role="tablist" aria-label="Select login role">
            <div class="role-indicator" aria-hidden="true"></div>
            <button type="button" class="role-tab is-active" id="tabStudent" data-role="student" role="tab" aria-selected="true" onclick="setRole('student')">
                <svg aria-hidden="true"><use href="#icon-user-graduate"/></svg>
                <span>Student</span>
            </button>
            <button type="button" class="role-tab" id="tabParent" data-role="parent" role="tab" aria-selected="false" onclick="setRole('parent')">
                <svg aria-hidden="true"><use href="#icon-users"/></svg>
                <span>Parent</span>
            </button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4" novalidate>
            <div>
                <label id="identityLabel" for="username" class="block text-sm font-semibold mb-1.5 text-navy">Roll number</label>
                <div class="input-wrap relative flex items-stretch rounded-xl border border-line bg-[#f7fafb] focus-within:border-[#4e9ab5] focus-within:bg-white focus-within:ring-4 focus-within:ring-[#4e9ab5]/15 transition-all overflow-hidden">
                    <div id="phonePrefix" class="phone-prefix hidden items-center px-3 border-r border-line bg-slate-100/80 text-navy font-semibold text-sm select-none">
                        <span class="mr-1.5 text-xs text-ink-muted">🇮🇳</span>+91
                    </div>
                    <span id="studentIcon" class="flex items-center pl-3.5 pr-1 text-ink-muted pointer-events-none">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="#icon-id-card"/></svg>
                    </span>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next"
                           placeholder="e.g. B24CS071"
                           class="login-input flex-1 px-3 py-2 bg-transparent border-0 text-base text-navy placeholder-ink-muted focus:outline-none">
                </div>
                <p id="identityHint" class="text-xs text-slate-500 mt-1.5">Enter your institutional roll number</p>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold mb-1.5 text-navy">Password</label>
                <div class="input-wrap relative flex items-stretch rounded-xl border border-line bg-[#f7fafb] focus-within:border-[#4e9ab5] focus-within:bg-white focus-within:ring-4 focus-within:ring-[#4e9ab5]/15 transition-all overflow-hidden">
                    <span class="flex items-center pl-3.5 pr-1 text-ink-muted pointer-events-none">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="#icon-lock"/></svg>
                    </span>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password" enterkeyhint="go"
                           class="login-input flex-1 px-3 py-2 bg-transparent border-0 text-base text-navy placeholder-ink-muted focus:outline-none">
                    <button type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" aria-label="Show or hide password" aria-pressed="false" class="min-w-[48px] min-h-[48px] flex items-center justify-center text-ink-muted hover:text-navy focus:outline-none cursor-pointer">
                        <svg id="passwordToggleIcon" class="w-5 h-5" aria-hidden="true"><use href="#icon-eye"/></svg>
                    </button>
                </div>
            </div>

            <label for="rememberMe" class="remember-row select-none">
                <input type="checkbox" id="rememberMe">
                <span class="text-sm text-slate-600 font-medium">Remember me</span>
            </label>

            <div id="loginError" class="login-error" role="alert" aria-live="polite"><svg class="w-4 h-4 shrink-0" aria-hidden="true"><use href="#icon-alert"/></svg><span></span></div>

            <button type="submit" id="btnSubmit" class="w-full py-3 px-4 text-white text-base font-semibold flex items-center justify-center gap-2.5 rounded-xl transition-all disabled:opacity-60 cursor-pointer">
                <span>Sign In</span>
                <svg class="w-5 h-5" aria-hidden="true"><use href="#icon-arrow-right"/></svg>
            </button>

            <p id="signupLinkRow" class="text-center text-sm text-slate-500 mt-4">
                New student? <button type="button" onclick="openSignupModal()" class="text-[#17333f] font-semibold hover:text-[#4fb3a9] underline underline-offset-2 p-1">Register here</button>
            </p>
        </form>
      </section>
      <p class="login-footer">KAMBUS &middot; Rider</p>
    </main>

    <!-- STUDENT SIGNUP MODAL -->
    <div id="signupModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 border border-slate-200 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-navy">Student Registration</h3>
                <button type="button" onclick="closeSignupModal()" aria-label="Close registration" class="w-10 h-10 flex items-center justify-center text-ink-muted hover:text-navy text-2xl font-bold rounded-lg hover:bg-slate-100 transition-colors">&times;</button>
            </div>
            <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3.5 text-sm">
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Full Name</label>
                    <input type="text" id="regName" required placeholder="Your full name" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Roll Number</label>
                    <input type="text" id="regRoll" required placeholder="e.g. B24CS071" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm uppercase focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Gender</label>
                    <select id="regGender" required class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm bg-white focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Email</label>
                    <input type="email" id="regEmail" required placeholder="student@kitsw.ac.in" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Phone Number</label>
                    <input type="tel" id="regPhone" required placeholder="10-digit phone" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div>
                    <label class="block font-semibold text-xs text-navy mb-1.5">Password</label>
                    <input type="password" id="regPassword" required minlength="6" placeholder="Min 6 characters" class="login-input w-full px-3.5 h-11 border border-line rounded-xl text-sm focus:outline-none focus:border-[#4e9ab5] focus:ring-2 focus:ring-[#4e9ab5]/20">
                </div>
                <div id="signupMsg" class="hidden text-xs p-2.5 rounded-xl"></div>
                <div class="pt-3 flex gap-3">
                    <button type="button" onclick="closeSignupModal()" class="flex-1 min-h-[48px] bg-slate-100 hover:bg-slate-200 text-navy font-semibold rounded-xl text-sm">Cancel</button>
                    <button type="submit" id="btnRegSubmit" class="flex-1 min-h-[48px] bg-navy hover:bg-navy/90 text-white font-semibold rounded-xl text-sm">Register</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = "https://kambus-backend.onrender.com";
        let currentRole = "student";

        function initCampusBadge() {
            const campusName = localStorage.getItem("kambus_campus_name") || "KITS Warangal";
            const el = document.getElementById("campusName");
            if (el) {
                el.textContent = `Signing in to ${campusName}`;
            }
        }

        function setRole(role) {
            currentRole = role;
            const tabsContainer = document.getElementById("roleTabs");
            const tabStudent = document.getElementById("tabStudent");
            const tabParent = document.getElementById("tabParent");
            const label = document.getElementById("identityLabel");
            const input = document.getElementById("username");
            const prefix = document.getElementById("phonePrefix");
            const studentIcon = document.getElementById("studentIcon");
            const hint = document.getElementById("identityHint");
            const signupRow = document.getElementById("signupLinkRow");

            hideLoginError();

            if (role === "parent") {
                if (tabsContainer) tabsContainer.style.setProperty("--role-position", "1");
                tabStudent?.classList.remove("is-active");
                tabStudent?.setAttribute("aria-selected", "false");
                tabParent?.classList.add("is-active");
                tabParent?.setAttribute("aria-selected", "true");

                if (label) label.textContent = "Phone number";
                if (prefix) prefix.classList.remove("hidden");
                if (prefix) prefix.classList.add("flex");
                if (studentIcon) studentIcon.classList.add("hidden");
                if (studentIcon) studentIcon.classList.remove("flex");
                if (input) {
                    input.type = "tel";
                    input.inputMode = "tel";
                    input.maxLength = 10;
                    input.placeholder = "10-digit registered phone";
                    input.autocomplete = "tel";
                    input.autocapitalize = "none";
                }
                if (hint) hint.textContent = "Enter your registered 10-digit mobile number";
                if (signupRow) signupRow.classList.add("hidden");
            } else {
                if (tabsContainer) tabsContainer.style.setProperty("--role-position", "0");
                tabParent?.classList.remove("is-active");
                tabParent?.setAttribute("aria-selected", "false");
                tabStudent?.classList.add("is-active");
                tabStudent?.setAttribute("aria-selected", "true");

                if (label) label.textContent = "Roll number";
                if (prefix) prefix.classList.add("hidden");
                if (prefix) prefix.classList.remove("flex");
                if (studentIcon) studentIcon.classList.remove("hidden");
                if (studentIcon) studentIcon.classList.add("flex");
                if (input) {
                    input.type = "text";
                    input.inputMode = "text";
                    input.removeAttribute("maxlength");
                    input.placeholder = "e.g. B24CS071";
                    input.autocomplete = "username";
                    input.autocapitalize = "characters";
                }
                if (hint) hint.textContent = "Enter your institutional roll number";
                if (signupRow) signupRow.classList.remove("hidden");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initCampusBadge();

            const isRemembered = localStorage.getItem("kambus_remember") === "true";
            const savedIdentifier = localStorage.getItem("kambus_saved_identifier");
            const savedRole = localStorage.getItem("kambus_saved_role");
            const rememberCheckbox = document.getElementById("rememberMe");

            if (savedRole === "parent") {
                setRole("parent");
            } else {
                setRole("student");
            }

            if (isRemembered && rememberCheckbox) {
                rememberCheckbox.checked = true;
                if (savedIdentifier) {
                    const usernameInput = document.getElementById("username");
                    if (usernameInput) usernameInput.value = savedIdentifier;
                }
            }
        });

        function showLoginError(message) {
            const banner = document.getElementById("loginError");
            if (!banner) return;
            banner.querySelector("span").textContent = message;
            banner.classList.add("visible");
        }

        function hideLoginError() {
            const banner = document.getElementById("loginError");
            if (banner) banner.classList.remove("visible");
        }

        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            if (!passwordInput || !toggleIcon) return;

            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            toggleIcon.innerHTML = `<use href="#icon-${isPassword ? 'eye-slash' : 'eye'}"/>`;
            const toggleButton = toggleIcon.closest("button");
            if (toggleButton) toggleButton.setAttribute("aria-pressed", String(isPassword));
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideLoginError();

            let identifier = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const rememberMe = document.getElementById("rememberMe")?.checked || false;
            const button = document.getElementById("btnSubmit");

            if (!identifier || !password) {
                const fieldName = currentRole === "student" ? "roll number" : "phone number";
                notifyUser("warn", "Required Fields", `Please enter your ${fieldName} and password.`);
                return;
            }

            // Clean phone number prefix if parent entered +91 or spaces
            if (currentRole === "parent") {
                const digits = identifier.replace(/\D/g, "");
                if (digits.length === 12 && digits.startsWith("91")) {
                    identifier = digits.slice(2);
                } else if (digits.length === 10) {
                    identifier = digits;
                }
            }

            const originalButtonContent = button.innerHTML;
            button.disabled = true;
            button.innerHTML = `
                <span>Signing In...</span>
                <svg class="w-5 h-5 animate-spin" aria-hidden="true"><use href="#icon-spinner"/></svg>
            `;

            try {
                let response = await fetch(`${API_BASE}/auth/login/rider`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password
                    })
                });

                // Fallback while remote backend is completing its redeploy
                if (response.status === 404) {
                    response = await fetch(`${API_BASE}/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ identifier: identifier, password: password, role: currentRole })
                    });
                    if (response.status === 401) {
                        const fallbackRole = currentRole === "student" ? "parent" : "student";
                        const altTry = await fetch(`${API_BASE}/auth/login`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ identifier: identifier, password: password, role: fallbackRole })
                        });
                        if (altTry.ok) {
                            response = altTry;
                        }
                    }
                }

                const data = await response.json();

                if (!response.ok) {
                    let errorTitle = "Invalid Credentials";
                    let errorMsg = data.detail || "Please check your login details and try again.";

                    if (response.status === 403) {
                        errorTitle = "Verification Required";
                        errorMsg = data.detail || "Your account is not verified yet. Please contact your transport administrator.";
                    } else if (response.status === 429) {
                        errorTitle = "Too Many Attempts";
                        errorMsg = data.detail || "Account temporarily locked. Please try again later.";
                    } else if (response.status >= 500) {
                        errorTitle = "Server Unavailable";
                        errorMsg = "Please try again in a few moments.";
                    }

                    throw new Error(errorMsg);
                }

                if (!data.access_token) {
                    throw new Error("Authentication response was incomplete.");
                }

                localStorage.setItem("kambus_token", data.access_token);
                localStorage.setItem("kambus_role", data.role);
                localStorage.setItem("kambus_user_id", data.user_id);
                if (data.student) {
                    localStorage.setItem("kambus_student_dashboard", JSON.stringify(data.student));
                }

                if (rememberMe) {
                    localStorage.setItem("kambus_remember", "true");
                    localStorage.setItem("kambus_saved_identifier", identifier);
                    localStorage.setItem("kambus_saved_role", currentRole);
                } else {
                    localStorage.setItem("kambus_remember", "false");
                    localStorage.removeItem("kambus_saved_identifier");
                    localStorage.removeItem("kambus_saved_role");
                }

                notifyUser("ok", "Signed In", "Welcome to KAMBUS.");

                setTimeout(() => {
                    if (data.role === "student") {
                        window.location.href = "student.html";
                    } else if (data.role === "parent") {
                        window.location.href = "parent.html";
                    } else {
                        window.location.href = currentRole === "parent" ? "parent.html" : "student.html";
                    }
                }, 150);

            } catch (error) {
                let displayMsg = error.message;
                let displayTitle = "Invalid Credentials";

                if (error.name === "TypeError" || error.message.includes("fetch") || error.message.includes("network")) {
                    displayTitle = "Connection Error";
                    displayMsg = "Please check your internet connection and try again.";
                }

                notifyUser("danger", displayTitle, displayMsg);
                showLoginError(displayMsg);
                button.disabled = false;
                button.innerHTML = originalButtonContent;
            }
        }

        function notifyUser(type, title, message) {
            if (typeof KambusNotify !== "undefined" && KambusNotify.notify) {
                KambusNotify.notify({ type, title, message });
            }
        }

        function openSignupModal() {
            document.getElementById("signupModal")?.classList.remove("hidden");
        }

        function closeSignupModal() {
            document.getElementById("signupModal")?.classList.add("hidden");
            const msg = document.getElementById("signupMsg");
            if (msg) { msg.classList.add("hidden"); msg.textContent = ""; }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById("btnRegSubmit");
            const msg = document.getElementById("signupMsg");
            const name = document.getElementById("regName").value.trim();
            const rollNumber = document.getElementById("regRoll").value.trim().toUpperCase();
            const gender = document.getElementById("regGender").value;
            const email = document.getElementById("regEmail").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const password = document.getElementById("regPassword").value;

            if (!gender) {
                msg.className = "text-xs p-2 rounded-lg bg-rose-50 text-rose-700 block";
                msg.textContent = "Please select your gender.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Registering...";
            msg.classList.add("hidden");

            try {
                const res = await fetch(`${API_BASE}/auth/student/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, roll_number: rollNumber, gender, email, phone, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Registration failed");

                msg.className = "text-xs p-2 rounded-lg bg-emerald-50 text-emerald-700 block";
                msg.textContent = data.message || "Registration submitted! Check email for OTP.";
                setTimeout(() => {
                    closeSignupModal();
                    notifyUser("ok", "Account Created", "Please verify your account to sign in.");
                }, 1500);
            } catch (err) {
                msg.className = "text-xs p-2 rounded-lg bg-rose-50 text-rose-700 block";
                msg.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "Register";
            }
        }
    </script>
</body>
