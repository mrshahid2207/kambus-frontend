<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>KAMBUS</title>
    <meta name="theme-color" content="#173541">
    <meta name="description" content="KAMBUS, live bus tracking for KITSW.">
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="favicon.ico?v=2" sizes="48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="kambus.css">
    <style>
        .splash-fade {
            transition: opacity 200ms ease;
        }
        .splash-fade.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body class="bg-navy w-full h-full min-h-screen flex flex-col items-center justify-center p-6 select-none overflow-hidden">
<main id="splashContent" class="splash-fade flex flex-col items-center justify-center">
    <img src="kambus-logo.svg" alt="KAMBUS" class="w-16 h-16" width="64" height="64">
</main>
<script>
    (function () {
        "use strict";
        function route() {
            var token = null;
            var role = null;
            var userId = null;
            var metadata = null;

            // 1. Check native EncryptedSharedPreferences via AndroidSession bridge
            if (window.AndroidSession && typeof window.AndroidSession.isSessionValid === "function") {
                try {
                    if (window.AndroidSession.isSessionValid()) {
                        var rawSession = window.AndroidSession.getSession();
                        var session = rawSession ? JSON.parse(rawSession) : null;
                        if (session && session.token && session.role) {
                            token = session.token;
                            role = session.role;
                            userId = session.user_id;
                            metadata = session.metadata;
                        }
                    } else {
                        window.AndroidSession.clearSession();
                        localStorage.removeItem("kambus_token");
                        localStorage.removeItem("kambus_role");
                        localStorage.removeItem("kambus_user_id");
                        localStorage.removeItem("kambus_student_dashboard");
                    }
                } catch (e) {
                    console.error("Error checking AndroidSession:", e);
                }
            }

            // 2. Fall back to localStorage (browser / PWA fallback)
            if (!token || !role) {
                token = localStorage.getItem("kambus_token") || localStorage.getItem("token");
                role = localStorage.getItem("kambus_role") || localStorage.getItem("role");
                userId = localStorage.getItem("kambus_user_id");
            }

            if (token && role) {
                localStorage.setItem("kambus_token", token);
                localStorage.setItem("kambus_role", role);
                if (userId) localStorage.setItem("kambus_user_id", userId);
                if (metadata && metadata.student) {
                    localStorage.setItem("kambus_student_dashboard", JSON.stringify(metadata.student));
                }
                if (role === "student") {
                    window.location.replace("student.html");
                    return;
                }
                if (role === "parent") {
                    window.location.replace("parent.html");
                    return;
                }
            }

            setTimeout(function () {
                var el = document.getElementById("splashContent");
                if (el) el.classList.add("fade-out");
                setTimeout(function () {
                    window.location.replace("index.html");
                }, 200);
            }, 800);
        }
        if (document.readyState === "complete" || document.readyState === "interactive") {
            route();
        } else {
            document.addEventListener("DOMContentLoaded", route);
        }
    })();
</script>
</body>
</html>
